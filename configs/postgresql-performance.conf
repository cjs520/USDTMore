# PostgreSQL 高并发性能优化配置
# 针对 USDT 支付系统的高并发场景优化
# 基于中等规格服务器（4-8GB RAM, 2-4 CPU cores）

# ========================================
# 内存设置
# ========================================

# 共享缓冲区（建议设为总内存的25-40%）
shared_buffers = 1GB

# 工作内存（每个排序或哈希操作可使用的内存）
work_mem = 4MB

# 维护工作内存（用于VACUUM, CREATE INDEX等操作）
maintenance_work_mem = 256MB

# 有效缓存大小（告诉优化器系统总共有多少内存可用于缓存）
effective_cache_size = 3GB

# 自动清理工作内存
autovacuum_work_mem = 256MB

# ========================================
# 连接和并发设置
# ========================================

# 最大连接数
max_connections = 200

# 每个数据库的最大prepared transactions
max_prepared_transactions = 100

# 超级用户保留的连接
superuser_reserved_connections = 3

# ========================================
# 写入性能优化
# ========================================

# WAL缓冲区大小
wal_buffers = 16MB

# 检查点完成目标（0.5-0.9之间，越高写入性能越好）
checkpoint_completion_target = 0.8

# 检查点段数（控制检查点频率）
max_wal_size = 2GB
min_wal_size = 512MB

# 同步提交（对于支付系统建议保持为on以确保数据安全）
synchronous_commit = on

# WAL写入方法
wal_sync_method = fsync

# 提交延迟（微秒，可以提高吞吐量但会增加延迟）
commit_delay = 0
commit_siblings = 5

# ========================================
# 查询优化
# ========================================

# 启用JIT编译（PostgreSQL 11+）
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# 随机页面成本（SSD建议设置为1.0-1.5）
random_page_cost = 1.1

# 顺序页面成本
seq_page_cost = 1.0

# CPU操作成本
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# ========================================
# 统计信息和查询规划
# ========================================

# 启用统计信息收集
track_counts = on
track_activities = on
track_io_timing = on
track_functions = all

# 统计信息目标（默认100，可以提高到1000以获得更好的查询计划）
default_statistics_target = 200

# ========================================
# 锁管理
# ========================================

# 死锁检测超时
deadlock_timeout = 1s

# 语句超时（防止长时间运行的查询）
statement_timeout = 60s

# 锁超时
lock_timeout = 30s

# 空闲事务超时
idle_in_transaction_session_timeout = 300s

# ========================================
# 自动清理优化
# ========================================

# 启用自动清理
autovacuum = on

# 自动清理最大工作进程数
autovacuum_max_workers = 3

# 自动清理开始延迟
autovacuum_naptime = 30s

# 自动清理阈值
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# 自动清理比例因子
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# 清理成本延迟（0表示不延迟，适合高并发场景）
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 2000

# ========================================
# 日志配置
# ========================================

# 日志级别
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000ms

# 记录长时间运行的查询
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# 日志语句类型
log_statement = 'ddl'

# 日志检查点
log_checkpoints = on

# 日志连接
log_connections = off
log_disconnections = off

# 日志锁等待
log_lock_waits = on

# ========================================
# 复制和高可用性设置
# ========================================

# WAL级别（支持复制）
wal_level = replica

# 最大WAL发送进程
max_wal_senders = 10

# WAL保留段数
wal_keep_segments = 32

# 热备份
hot_standby = on

# 热备份反馈
hot_standby_feedback = on

# 最大复制槽
max_replication_slots = 10

# ========================================
# 安全设置
# ========================================

# SSL设置
ssl = on
ssl_ciphers = 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# 密码加密
password_encryption = scram-sha-256

# 连接加密
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

# ========================================
# 扩展设置
# ========================================

# 共享预加载库
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# pg_stat_statements设置
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# 自动解释慢查询
auto_explain.log_min_duration = 1000ms
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = on

# ========================================
# 临时文件和磁盘使用
# ========================================

# 临时文件大小限制
temp_file_limit = 2GB

# 临时表空间
# temp_tablespaces = 'temp_tbs'

# 磁盘临时文件日志
log_temp_files = 100MB

# ========================================
# 其他性能调优
# ========================================

# 有效的IO并发数（对于SSD，建议设置较高值）
effective_io_concurrency = 200

# 后台写入器设置
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# 检查点写入器设置
checkpoint_flush_after = 256kB

# 时区
timezone = 'Asia/Shanghai'

# 语言设置
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ========================================
# 监控和诊断
# ========================================

# 启用查询ID跟踪
compute_query_id = on

# 启用WAL压缩
wal_compression = on

# 启用数据校验和
data_checksums = on

# ========================================
# 高并发特定优化
# ========================================

# 减少锁争用
vacuum_cost_delay = 0

# 优化小事务处理
wal_writer_delay = 10ms
wal_writer_flush_after = 1MB

# 优化内存分配
dynamic_shared_memory_type = posix

# 并行查询设置
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0