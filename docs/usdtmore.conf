# USDTMore v2.1.0 配置文件模板
# 部署时请根据实际情况修改以下配置

# ⚠️  重要提醒：
# 1. 所有标记为"必须修改"的配置项都需要根据实际情况修改
# 2. API密钥必须从对应平台获取并填入
# 3. 数据库密码必须设置为强密码
# 4. AUTH_TOKEN必须设置为32位以上的强密钥

# ==================== 基本配置（必须修改）====================
LISTEN=:6080
EXPIRE_TIME=1800
# ⚠️ 必须修改：设置32位以上的强密钥
AUTH_TOKEN=请替换为你的强密钥_至少32位字符
REWRITE_HTTPS=true

# 应用配置
APP_URI=https://你的域名.com
WALLET_ADDRESS=TRON:你的TRON地址,BSC:你的BSC地址,POLY:你的Polygon地址

# ==================== API配置（必须修改）====================
# ⚠️ 以下API密钥必须从对应平台获取并填入

# Telegram机器人配置（必需）
TG_BOT_TOKEN=你的机器人Token
TG_BOT_ADMIN_ID=你的管理员ID
TG_BOT_GROUP_ID=你的群组ID

# API Keys（必需）
ETHERSCAN_API_KEY=你的Etherscan_API_Key    # EVM链统一API Key
TRON_SCAN_API_KEY=你的TRON_SCAN_API_KEY     # TRON链API Key
TRON_GRID_API_KEY=你的TRON_GRID_API_KEY     # TRON Grid API Key
SOLANA_API_KEY=你的Solana_API_Key           # Solana链API Key (可选)

# 网络配置
TRON_SERVER_API=https://apilist.tronscanapi.com/api/block
ETH_CONFIRMATION=0                          # EVM链确认数
TRADE_IS_CONFIRMED=0                        # TRON链是否需要确认

# 支付配置
PAYMENT_AMOUNT_RANGE=0.01,99999             # 支付金额范围

# ==================== PostgreSQL数据库配置（必须修改）====================
# ⚠️ 必须修改数据库配置
DB_TYPE=postgres
DB_HOST=localhost                           # Docker部署时改为: postgres
DB_PORT=5432
DB_NAME=usdtmore
DB_USER=usdtmore
# ⚠️ 必须修改：设置强密码
DB_PASSWORD=YOUR_DB_PASSWORD
DB_SSLMODE=disable                          # 生产环境建议改为: require
DB_TIMEZONE=Asia/Shanghai

# ==================== 文件路径配置 ====================
LOG_DIR=/var/log/usdtmore
HTML_DIR=/usr/share/usdtmore                # Docker部署时会自动设置为/runtime

# ==================== 支持的区块链网络 ====================
# 当前支持的链和对应的API密钥：
# - TRON (USDT-TRC20): TRON_GRID_API_KEY
# - Polygon (USDT-ERC20): ETHERSCAN_API_KEY  
# - Optimism (USDT-ERC20): ETHERSCAN_API_KEY
# - BSC (USDT-BEP20): ETHERSCAN_API_KEY
# - Arbitrum One (USDT-ERC20): ETHERSCAN_API_KEY
# - X-Layer (USDT): ETHERSCAN_API_KEY
# - Solana (USDT-SPL): SOLANA_API_KEY
# - Aptos (USDT): 无需API Key

# ==================== 部署说明 ====================
# 1. Docker部署：
#    - 复制此文件为 .env
#    - 修改所有"必须修改"的配置项
#    - 运行: docker-compose up -d
#
# 2. 手动部署：
#    - 复制此文件到 /etc/usdtmore/usdtmore.conf
#    - 修改所有"必须修改"的配置项
#    - 创建systemd服务并启动
#
# 3. API密钥获取地址：
#    - Etherscan (EVM链): https://etherscan.io/apis
#    - TRON Grid: https://www.trongrid.io/
#    - TRON Scan: https://tronscan.org/
#    - Solana: https://docs.solana.com/api
#    - Telegram Bot: https://t.me/BotFather
#
# 4. 详细部署指南请参考：docs/DEPLOYMENT.md

# ==================== Docker环境变量对照表 ====================
# 如果使用Docker部署，以下是环境变量对照：
# LISTEN -> PORT (Docker中使用PORT)
# AUTH_TOKEN -> AUTH_TOKEN
# APP_URI -> APP_URI  
# WALLET_ADDRESS -> WALLET_ADDRESS
# TG_BOT_TOKEN -> TG_BOT_TOKEN
# TG_BOT_ADMIN_ID -> TG_BOT_ADMIN_ID
# TG_BOT_GROUP_ID -> TG_BOT_GROUP_ID
# ETHERSCAN_API_KEY -> ETHERSCAN_API_KEY
# TRON_SCAN_API_KEY -> TRON_SCAN_API_KEY
# TRON_GRID_API_KEY -> TRON_GRID_API_KEY
# SOLANA_API_KEY -> SOLANA_API_KEY
# DB_* -> DB_* (数据库配置保持一致)