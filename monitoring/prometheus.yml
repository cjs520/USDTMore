global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'usdtmore-primary'
    static_configs:
      - targets: ['usdtmore-primary:6080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'usdtmore-secondary'
    static_configs:
      - targets: ['usdtmore-secondary:6080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 5s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 5s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # Database metrics
  - job_name: 'postgres-primary'
    static_configs:
      - targets: ['postgres-primary:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s